[env]
# TERM: xterm-256color-italic

[window]
    dimensions = { columns = 100, lines = 85 }
    padding = {x = 2, y = 2}
    dynamic_padding = true
    decorations = "Full"
    startup_mode = "Maximized"
#  opacity: 1.0

[scrolling]
    history = 10000
    multiplier = 3

[font]
    normal = { family = "Comic Code", style = "Light" }
    bold = { family = "Comic Code", style = "Medium" }
    italic = { family = "Comic Code", style = "Light Italic" }
    size = 7.0

# Offset is the extra space around each character. offset.y can be thought of
# as modifying the linespacing, and offset.x as modifying the letter spacing.
    offset = { x = 0, y = 0 }

# Glyph offset determines the locations of the glyphs within their cells with
# the default being at the bottom. Increase the x offset to move the glyph to
# the right, increase the y offset to move the glyph upward.
    glyph_offset = { x = 0, y = 0 }

[colors]
    draw_bold_text_with_bright_colors = false

[colors.primary]
    background = "#282a36"
    foreground = "#f8f8f2"
    bright_foreground = "#ffffff"
[colors.cursor]
    text = "CellBackground"
    cursor = "CellForeground"
[colors.vi_mode_cursor]
    text = "CellBackground"
    cursor = "CellForeground"
[colors.search]
    matches = { foreground = "#44475a", background = "#50fa7b" }
    focused_match = { foreground = "#44475a", background = "#ffb86c" }
[colors.footer_bar]
    background = "#282a36"
    foreground = "#f8f8f2"
[colors.hints]
    start = { foreground = "#282a36", background = "#f1fa8c" }
    end = { foreground = "#f1fa8c", background = "#282a36" }
[colors.line_indicator]
    foreground = "None"
    background = "None"
[colors.selection]
    text = "CellForeground"
    background = "#44475a"
[colors.normal]
    black = "#21222c"
    red = "#ff5555"
    green = "#50fa7b"
    yellow = "#f1fa8c"
    blue = "#bd93f9"
    magenta = "#ff79c6"
    cyan = "#8be9fd"
    white = "#f8f8f2"
[colors.bright]
    black = "#6272a4"
    red = "#ff6e6e"
    green = "#69ff94"
    yellow = "#ffffa5"
    blue = "#d6acff"
    magenta = "#ff92df"
    cyan = "#a4ffff"
    white = "#ffffff"

[bell]
  animation = "EaseOutExpo"

